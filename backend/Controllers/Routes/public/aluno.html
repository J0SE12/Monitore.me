<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitore.me - Área do Aluno</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background: #fff;
            padding: 20px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            margin: 0;
            font-size: 24px;
            color: #333;
        }
        .search-bar {
            margin-bottom: 20px;
            text-align: center;
        }
        .search-bar input {
            width: 80%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .search-bar button {
            padding: 10px 20px;
            background-color: #007BFF;
            color: white;
            border: none;
            cursor: pointer;
            margin-left: 10px;
        }
        .search-bar button:hover {
            background-color: #0056b3;
        }
        .results {
            margin-top: 20px;
        }
        .results .discipline {
            padding: 10px;
            background-color: #e9e9e9;
            margin-bottom: 10px;
            border-radius: 4px;
        }
        .results .discipline h2 {
            margin: 0;
            font-size: 20px;
        }
        .results .discipline p {
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Área do Aluno</h1>
        </div>
        <div class="search-bar">
            <input type="text" id="search" placeholder="Pesquise por disciplinas...">
            <button onclick="pesquisarDisciplinas()">Pesquisar</button>
        </div>
        <div class="results" id="results">
            <!-- Resultados da pesquisa serão exibidos aqui -->
        </div>
    </div>

    <script>
        async function pesquisarDisciplinas() {
            const searchQuery = document.getElementById('search').value;

            try {
                const response = await fetch(`/api/pesquisar-disciplinas?query=${encodeURIComponent(searchQuery)}`);
                const disciplinas = await response.json();

                const resultsDiv = document.getElementById('results');
                resultsDiv.innerHTML = '';

                if (disciplinas.length > 0) {
                    disciplinas.forEach(disciplina => {
                        const disciplinaDiv = document.createElement('div');
                        disciplinaDiv.className = 'discipline';

                        const title = document.createElement('h2');
                        title.textContent = disciplina.nome;

                        const description = document.createElement('p');
                        description.textContent = disciplina.descricao;

                        const monitor = document.createElement('p');
                        monitor.textContent = `Monitor: ${disciplina.monitor_nome}`;

                        disciplinaDiv.appendChild(title);
                        disciplinaDiv.appendChild(description);
                        disciplinaDiv.appendChild(monitor);

                        resultsDiv.appendChild(disciplinaDiv);
                    });
                } else {
                    resultsDiv.textContent = 'Nenhuma disciplina encontrada.';
                }
            } catch (error) {
                console.error('Erro:', error);
                alert('Erro ao pesquisar disciplinas.');
            }
        }
    </script>
</body>
</html>
