<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitore.me - Área do Aluno</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Cabeçalho -->
        <div class="header text-center my-4">
            <h1>Área do Aluno</h1>
        </div>

        <!-- Barra de Pesquisa -->
        <div class="search-bar d-flex flex-column flex-md-row align-items-center my-3">
            <input type="text" class="form-control mr-2" id="search" placeholder="Pesquise por disciplinas...">
            <button class="btn btn-primary mt-2 mt-md-0" onclick="pesquisarDisciplinas()">Pesquisar</button>
        </div>

        <!-- Filtro Avançado -->
        <div class="filter-advanced mt-3">
            <label for="monitor">Monitor:</label>
            <select id="monitor" class="form-control">
                <option value="">Selecione...</option>
                <!-- Listar monitores aqui -->
            </select>
            <label for="horario">Horário:</label>
            <input type="time" id="horario" class="form-control">
            <button class="btn btn-secondary mt-2" onclick="pesquisarDisciplinasAvancado()">Filtrar</button>
        </div>

        <!-- Resultados da Pesquisa -->
        <div class="results mt-4" id="results">
            <!-- Resultados da pesquisa serão exibidos aqui -->
        </div>

        <!-- Seção de Notificações -->
        <div class="notifications mt-4">
            <h3>Notificações</h3>
            <ul id="notificationList">
                <!-- Notificações serão carregadas aqui -->
            </ul>
        </div>

        <!-- Botão para Avaliar Monitor -->
        <button class="btn btn-primary mt-4" onclick="avaliarMonitor()">Avaliar Monitor</button>

        <!-- Modal de Avaliação -->
        <div id="avaliacaoModal" class="modal fade" tabindex="-1" role="dialog">
            <div class="modal-dialog" role="document">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Avaliar Monitor</h5>
                        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                            <span aria-hidden="true">&times;</span>
                        </button>
                    </div>
                    <div class="modal-body">
                        <textarea id="feedback" class="form-control" placeholder="Escreva seu feedback aqui..."></textarea>
                        <div class="rating mt-2">
                            <span>Nota:</span>
                            <select id="rating" class="form-control">
                                <option value="1">1</option>
                                <option value="2">2</option>
                                <option value="3">3</option>
                                <option value="4">4</option>
                                <option value="5">5</option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-primary" onclick="submitFeedback()">Enviar Avaliação</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Função para pesquisar disciplinas
        async function pesquisarDisciplinas() {
            const searchQuery = document.getElementById('search').value;

            try {
                const response = await fetch(`/api/pesquisar-disciplinas?query=${encodeURIComponent(searchQuery)}`);
                const disciplinas = await response.json();

                const resultsDiv = document.getElementById('results');
                resultsDiv.innerHTML = '';

                if (disciplinas.length > 0) {
                    disciplinas.forEach(disciplina => {
                        const disciplinaDiv = document.createElement('div');
                        disciplinaDiv.className = 'discipline';

                        const title = document.createElement('h2');
                        title.textContent = disciplina.nome;

                        const description = document.createElement('p');
                        description.textContent = disciplina.descricao;

                        const monitor = document.createElement('p');
                        monitor.textContent = `Monitor: ${disciplina.monitor_nome}`;

                        const certificadoBtn = document.createElement('button');
                        certificadoBtn.className = 'btn btn-success';
                        certificadoBtn.textContent = 'Baixar Certificado';
                        certificadoBtn.onclick = () => downloadCertificado(disciplina.id);

                        disciplinaDiv.appendChild(title);
                        disciplinaDiv.appendChild(description);
                        disciplinaDiv.appendChild(monitor);
                        disciplinaDiv.appendChild(certificadoBtn);

                        resultsDiv.appendChild(disciplinaDiv);
                    });
                } else {
                    resultsDiv.textContent = 'Nenhuma disciplina encontrada.';
                }
            } catch (error) {
                console.error('Erro:', error);
                alert('Erro ao pesquisar disciplinas.');
            }
        }

        // Função para baixar o certificado
        function downloadCertificado(disciplinaId) {
            window.location.href = `/api/baixar-certificado?disciplinaId=${disciplinaId}`;
        }

        // Função para carregar notificações
        async function carregarNotificacoes() {
            try {
                const response = await fetch(`/api/obter-notificacoes`);
                const notificacoes = await response.json();

                const notificationList = document.getElementById('notificationList');
                notificationList.innerHTML = '';

                notificacoes.forEach(n => {
                    const li = document.createElement('li');
                    li.textContent = n.mensagem;
                    notificationList.appendChild(li);
                });
            } catch (error) {
                console.error('Erro ao carregar notificações:', error);
            }
        }

        // Função para abrir o modal de avaliação
        function avaliarMonitor() {
            $('#avaliacaoModal').modal('show');
        }

        // Função para enviar feedback
        async function submitFeedback() {
            const feedback = document.getElementById('feedback').value;
            const rating = document.getElementById('rating').value;

            try {
                await fetch('/api/enviar-avaliacao', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ feedback, rating })
                });
                alert('Avaliação enviada com sucesso!');
                $('#avaliacaoModal').modal('hide');
            } catch (error) {
                console.error('Erro ao enviar avaliação:', error);
                alert('Erro ao enviar avaliação.');
            }
        }

        // Inicializa a página carregando as notificações
        carregarNotificacoes();
    </script>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
