<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitore.me - Página Inicial</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background: #fff;
            padding: 20px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            margin: 0;
            font-size: 24px;
            color: #333;
        }
        .role-selection {
            margin-bottom: 30px;
            text-align: center;
        }
        .role-selection button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            margin: 5px;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
        .role-selection button:hover {
            background-color: #45a049;
        }
        .monitor-options, .aluno-options {
            display: none;
            margin-top: 20px;
            text-align: center;
        }
        .monitor-options button {
            background-color: #007BFF;
            color: white;
            padding: 10px 20px;
            margin: 5px;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
        .monitor-options button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Bem-vindo ao Monitore.me</h1>
        </div>
        <div class="role-selection">
            <button onclick="mostrarOpcoes('monitor')">Sou Monitor</button>
            <button onclick="mostrarOpcoes('aluno')">Sou Aluno</button>
        </div>
        <div class="monitor-options" id="monitor-options">
            <h2>Opções do Monitor</h2>
            <button onclick="criarSala()">Criar Sala de Aula</button>
            <button onclick="criarAssunto()">Criar Assunto</button>
        </div>
        <div class="aluno-options" id="aluno-options">
            <h2>Opções do Aluno</h2>
            <p>Aqui você pode acessar suas disciplinas e ver o conteúdo disponível.</p>
            <!-- Adicione mais funcionalidades para os alunos aqui -->
        </div>
    </div>

    <script>
        function mostrarOpcoes(role) {
            document.getElementById('monitor-options').style.display = 'none';
            document.getElementById('aluno-options').style.display = 'none';
            
            if (role === 'monitor') {
                document.getElementById('monitor-options').style.display = 'block';
            } else if (role === 'aluno') {
                document.getElementById('aluno-options').style.display = 'block';
            }
        }

        function criarSala() {
            alert('Funcionalidade de criação de sala de aula');
            // Aqui você pode redirecionar para a página de criação de sala de aula
        }

        function criarAssunto() {
            alert('Funcionalidade de criação de assunto');
            // Aqui você pode redirecionar para a página de criação de assunto
        }
    </script>
</body>
</html>
