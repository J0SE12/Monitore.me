<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitore.me - Monitor</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background: #fff;
            padding: 20px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            margin: 0;
            font-size: 24px;
            color: #333;
        }
        .monitor-options {
            margin-top: 20px;
            text-align: center;
        }
        .monitor-options button {
            background-color: #007BFF;
            color: white;
            padding: 10px 20px;
            margin: 5px;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
        .monitor-options button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Área do Monitor</h1>
        </div>
        <div class="monitor-options">
            <button onclick="criarSala()">Criar Sala de Aula</button>
            <button onclick="criarAssunto()">Criar Assunto</button>
        </div>
    </div>

    <script>
        function criarSala() {
            // Redirecionar para a página de criação de sala de aula
            window.location.href = 'cadastro_aula.html';
        }

        function criarAssunto() {
            // Redirecionar para a página de criação de assunto
            window.location.href = 'cadastro_assunto.html';
        }
    </script>
</body>
</html>
